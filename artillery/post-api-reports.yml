# POST /api/reports — multipart
# Requires: PERF_TOKEN_PUBLIC_USER

config:
  target: "http://localhost:5000"
  http:
    timeout: 60

  phases:
    - duration: 30
      arrivalRate: 3
      name: "steady"
  plugins:
    ensure: {}
  ensure:
    thresholds:
      - http.response_time.p95: 15000
      - http.response_time.p99: 25000
scenarios:
  - name: "POST /api/reports"
    flow:
      - post:
          url: "/api/reports"
          headers:
            Authorization: "Bearer {{ $environment.PERF_TOKEN_PUBLIC_USER }}"
          formData:
            district: "Galle"
            reportDate: "2026-04-11"
            reportTime: "10:30"
            location: "Test location"
            latitude: "6.0"
            longitude: "80.0"
            description: "Performance test report description text."
