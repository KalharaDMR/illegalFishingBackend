# PUT /api/profile/public/password
# Requires: PERF_TOKEN_PUBLIC_USER, PERF_CURRENT_PASSWORD, PERF_NEW_PASSWORD

config:
  target: "http://localhost:5000"
  http:
    timeout: 60

  phases:
    - duration: 30
      arrivalRate: 3
      name: "steady"
  plugins:
    ensure: {}
  ensure:
    thresholds:
      - http.response_time.p95: 15000
      - http.response_time.p99: 25000
scenarios:
  - name: "PUT /api/profile/public/password"
    flow:
      - put:
          url: "/api/profile/public/password"
          headers:
            Content-Type: "application/json"
            Authorization: "Bearer {{ $environment.PERF_TOKEN_PUBLIC_USER }}"
          json:
            currentPassword: "{{ $environment.PERF_CURRENT_PASSWORD }}"
            newPassword: "{{ $environment.PERF_NEW_PASSWORD }}"
