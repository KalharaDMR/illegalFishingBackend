# DELETE /api/reports/:id
# Requires: PERF_TOKEN_PUBLIC_USER, PERF_REPORT_ID

config:
  target: "http://localhost:5000"
  http:
    timeout: 60

  phases:
    - duration: 30
      arrivalRate: 3
      name: "steady"
  plugins:
    ensure: {}
  ensure:
    thresholds:
      - http.response_time.p95: 15000
      - http.response_time.p99: 25000
scenarios:
  - name: "DELETE /api/reports/:id"
    flow:
      - delete:
          url: "/api/reports/{{ $environment.PERF_REPORT_ID }}"
          headers:
            Authorization: "Bearer {{ $environment.PERF_TOKEN_PUBLIC_USER }}"
