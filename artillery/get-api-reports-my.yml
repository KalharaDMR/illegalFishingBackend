# GET /api/reports/my
# Requires: PERF_TOKEN_PUBLIC_USER

config:
  target: "http://localhost:5000"
  http:
    timeout: 60

  phases:
    - duration: 30
      arrivalRate: 3
      name: "steady"
  plugins:
    ensure: {}
  ensure:
    thresholds:
      - http.response_time.p95: 15000
      - http.response_time.p99: 25000
scenarios:
  - name: "GET /api/reports/my"
    flow:
      - get:
          url: "/api/reports/my"
          headers:
            Authorization: "Bearer {{ $environment.PERF_TOKEN_PUBLIC_USER }}"
